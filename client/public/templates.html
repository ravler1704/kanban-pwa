<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Шаблоны досок — Offline Kanban</title>
  <meta name="description" content="Готовые наборы колонок для канбан-доски: классический канбан, Scrum, контент, поддержка, найм. Создайте доску в своём пространстве одним кликом." />
  <link rel="canonical" href="https://178-83-123-195.sslip.io/templates.html" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --border: #334155;
      --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.55 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    a { color: var(--accent); }
    .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px 64px; }
    .top { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px);
      background: rgba(15, 23, 42, 0.85); border-bottom: 1px solid var(--border); }
    .top .wrap { display: flex; align-items: center; gap: 16px; min-height: 56px; padding-top: 8px; padding-bottom: 8px; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-weight: 700; }
    .brand img { width: 28px; height: 28px; border-radius: 8px; }
    .top nav { margin-left: auto; display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.9rem; }
    .top nav a { color: var(--muted); text-decoration: none; }
    .top nav a:hover { color: var(--text); }
    h1 { font-size: clamp(1.75rem, 4vw, 2.25rem); margin: 32px 0 8px; letter-spacing: -0.02em; }
    .lead { color: var(--muted); margin: 0 0 28px; max-width: 640px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; border-radius: 12px;
      border: 1px solid var(--accent); background: var(--accent); color: #0f172a; font: inherit; font-weight: 600;
      text-decoration: none; cursor: pointer; width: 100%; margin-top: auto; }
    .btn:hover { background: #7dd3fc; border-color: #7dd3fc; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 1.15rem 1.2rem;
      display: flex; flex-direction: column; gap: 8px; min-height: 220px; }
    .card h2 { margin: 0; font-size: 1.05rem; }
    .card p { margin: 0; color: var(--muted); font-size: 0.92rem; line-height: 1.45; flex: 1; }
    .cols { margin: 0; font-size: 0.82rem; color: var(--muted); }
    .meta { font-size: 0.8rem; color: var(--muted); }
    .tpl-preview { border-radius: 10px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 8px; }
    .tpl-preview-board { display: flex; gap: 5px; padding: 8px; min-height: 5.5rem; background: var(--panel); }
    .tpl-preview-col { flex: 1; min-width: 0; padding: 4px 3px; border-radius: 6px; border: 1px solid var(--border);
      background: #273449; display: flex; flex-direction: column; gap: 3px; }
    .tpl-preview-col[style*="--c"] { background: color-mix(in srgb, var(--c) 24%, #273449); border-color: color-mix(in srgb, var(--c) 45%, var(--border)); }
    .tpl-preview-head { font-size: 0.65rem; font-weight: 600; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      border-top: 2px solid var(--border); padding-top: 2px; }
    .tpl-ph { height: 0.85rem; border-radius: 3px; background: #334155; border: 1px solid #3b4a63; }
    footer { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border);
      color: var(--muted); font-size: 0.88rem; display: flex; flex-wrap: wrap; gap: 12px 20px; }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--text); }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/promo.html"><img src="/icon.svg" alt="" width="28" height="28" />Offline Kanban</a>
      <nav aria-label="Навигация">
        <a href="/promo.html">О приложении</a>
        <a href="/install.html">Установка</a>
        <a href="/releases.html">Что нового</a>
        <a href="/">Открыть</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <h1>Витрина шаблонов</h1>
    <p class="lead">Нажмите «Создать доску» — откроется приложение, и в вашем пространстве появится новая доска с колонками и оформлением из шаблона. Нужен вход в аккаунт.</p>
    <div class="grid" id="grid" aria-live="polite"><p class="lead">Загрузка…</p></div>
    <footer>
      <a href="/promo.html">Промо</a>
      <a href="/">Приложение</a>
      <a href="https://github.com/ravler1704/kanban-pwa">GitHub</a>
    </footer>
  </main>
  <script>
  (async () => {
    const grid = document.getElementById('grid');
    const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    const COL = { blue: '#579dff', green: '#4bce97', orange: '#fea362', purple: '#9f8fef', red: '#f87168', teal: '#6cc3e0', gray: '#8590a2' };
    const BG = {
      ocean: 'linear-gradient(135deg, #0c66e4, #09326c)', forest: 'linear-gradient(135deg, #16a34a, #0f3d2e)',
      sunset: 'linear-gradient(135deg, #f97316, #be185d)', dusk: 'linear-gradient(135deg, #7c3aed, #312e81)',
      aurora: 'linear-gradient(135deg, #0891b2, #16a34a)', night: 'linear-gradient(135deg, #1e293b, #020617)',
      blue: '#1d4ed8', green: '#15803d', orange: '#c2410c', red: '#b91c1c', purple: '#6d28d9', teal: '#0f766e', gray: '#475569',
    };
    function tplPreview(payload) {
      const bg = payload.background && BG[payload.background] ? ` style="background:${BG[payload.background]}"` : '';
      const cols = payload.columns.map((c, i) => {
        const style = c.color && COL[c.color] ? ` style="--c:${COL[c.color]}"` : '';
        const ph = i < 3 ? '<div class="tpl-ph"></div>' + (i === 0 ? '<div class="tpl-ph"></div>' : '') : '';
        return `<div class="tpl-preview-col"${style}><div class="tpl-preview-head">${esc(c.name)}</div>${ph}</div>`;
      }).join('');
      return `<div class="tpl-preview"><div class="tpl-preview-board"${bg}>${cols}</div></div>`;
    }
    try {
      const res = await fetch('/api/templates?limit=50');
      if (!res.ok) throw new Error();
      const { templates } = await res.json();
      if (!templates?.length) {
        grid.innerHTML = '<p class="lead">Пока нет шаблонов.</p>';
        return;
      }
      grid.innerHTML = templates.map((t) => {
        const tid = esc(t.id);
        return `<article class="card">
          ${tplPreview(t.payload)}
          <h2>${esc(t.title)}</h2>
          <p>${esc(t.description)}</p>
          <p class="meta">${esc(t.author?.name)} · использований: ${t.usesCount ?? 0}</p>
          <a class="btn" href="/?template=${encodeURIComponent(t.id)}"
            onclick="try{sessionStorage.setItem('pendingBoardTemplate','${tid}')}catch(e){}">Создать доску</a>
        </article>`;
      }).join('');
    } catch {
      grid.innerHTML = '<p class="lead">Не удалось загрузить витрину. Попробуйте позже или откройте шаблоны в меню доски в <a href="/">приложении</a>.</p>';
    }
  })();
  </script>
</body>
</html>
