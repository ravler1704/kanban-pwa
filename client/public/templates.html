  <script>
  (async () => {
    const grid = document.getElementById('grid');
    const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    const COL = { blue: '#579dff', green: '#4bce97', orange: '#fea362', purple: '#9f8fef', red: '#f87168', teal: '#6cc3e0', gray: '#8590a2' };
    const BG = { ocean: 'linear-gradient(135deg, #0c66e4, #09326c)', forest: 'linear-gradient(135deg, #16a34a, #0f3d2e)', sunset: 'linear-gradient(135deg, #f97316, #be185d)', dusk: 'linear-gradient(135deg, #7c3aed, #312e81)', aurora: 'linear-gradient(135deg, #0891b2, #16a34a)', night: 'linear-gradient(135deg, #1e293b, #020617)', blue: '#1d4ed8', green: '#15803d', orange: '#c2410c', red: '#b91c1c', purple: '#6d28d9', teal: '#0f766e', gray: '#475569' };
    function tplPreview(payload) {
      const bg = payload.background && BG[payload.background] ? ` style="background:${BG[payload.background]}"` : '';
      const cols = (payload.columns || []).map((c, i) => {
        const style = c.color && COL[c.color] ? ` style="--c:${COL[c.color]}"` : '';
        const ph = i < 3 ? '<div class="tpl-ph"></div>' + (i === 0 ? '<div class="tpl-ph"></div>' : '') : '';
        return `<div class="tpl-preview-col"${style}><div class="tpl-preview-head">${esc(c.name)}</div>${ph}</div>`;
      }).join('');
      return `<div class="tpl-preview"><div class="tpl-preview-board"${bg}>${cols}</div></div>`;
    }
    function t(key) { const d = (window.SITE_I18N && window.SITE_I18N[window.__siteLang || 'en']) || {}; const en = (window.SITE_I18N && window.SITE_I18N.en) || {}; return d[key] || en[key] || key; }
    try {
      const res = await fetch('/api/templates?limit=50');
      if (!res.ok) throw new Error();
      const { templates } = await res.json();
      if (!templates?.length) { grid.innerHTML = `<p class="lead">${esc(t('empty'))}</p>`; return; }
      grid.innerHTML = templates.map((tplt) => {
        const tid = esc(tplt.id);
        return `<article class="card">${tplPreview(tplt.payload || {})}<h2>${esc(tplt.title)}</h2><p>${esc(tplt.description)}</p><p class="meta">${esc(tplt.author?.name || t('author_fallback'))} · ${esc(t('uses'))}: ${tplt.usesCount ?? 0}</p><a class="btn" href="/?template=${encodeURIComponent(tplt.id)}" onclick="try{sessionStorage.setItem('pendingBoardTemplate','${tid}')}catch(e){}">${esc(t('create_board'))}</a></article>`;
      }).join('');
    } catch { grid.innerHTML = `<p class="lead">${esc(t('error'))}</p>`; }
    document.addEventListener('site-lang-change', () => { /* re-render on language change by reloading data labels would be complex; reload page section */ location.reload(); });
  })();
  </script>
